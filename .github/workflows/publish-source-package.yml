name: Publish source package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version (for example, v1.0.0)
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: source-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 60
    name: Publish OCI source package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Resolve package metadata
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG:-${INPUT_VERSION:-}}"
          if [[ -z "$version" ]]; then
            version="sha-${GITHUB_SHA::12}"
          fi
          version="${version#v}"

          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Invalid OCI package version: $version"
            exit 1
          fi

          repository="${GITHUB_REPOSITORY,,}"
          echo "package=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          project="${GITHUB_REPOSITORY#*/}"
          git archive \
            --format=tar.gz \
            --prefix="$project-$VERSION/" \
            --output=source.tar.gz \
            HEAD
          sha256sum source.tar.gz > source.tar.gz.sha256

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            oras login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish package
        env:
          PACKAGE: ${{ steps.metadata.outputs.package }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          oras push "$PACKAGE:$VERSION" \
            --artifact-type application/vnd.oci.source.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            source.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip \
            source.tar.gz.sha256:text/plain
